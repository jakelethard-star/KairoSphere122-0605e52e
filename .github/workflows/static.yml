# Simple workflow for deploying static content to GitHub Pages
name: Build and deploy KairoSphere to GitHub Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Supabase publishable configuration is public by design and safe for browser use.
# Repository variables override these project defaults if configured later.
env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ndmmmxxxlseouxkduedh.supabase.co' }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_5XsfkcrVyrpXK95IC6wa1g_EwGBttGl' }}
  VITE_AUTH_REDIRECT_URL: ${{ vars.VITE_AUTH_REDIRECT_URL || 'https://jakelethard-star.github.io/KairoSphere122-0605e52e/' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Verify Supabase public configuration
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Supabase project URL is missing."; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Supabase publishable key is missing."; exit 1; }
      - name: Build application
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
